plugins {
    id 'com.android.application'
}

android {
    namespace 'com.live2image.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.live2image.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        externalNativeBuild {
            ndk {
                abiFilters = []
                abiFilters.addAll("arm64-v8a:x86:x86_64".split(':').collect { it as String })
            }
        }
        ndkVersion "26.3.11579264"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'

    // CameraX（フロントカメラ プレビュー + 解析）
    // 注: camera-view は viewfinder-core に依存し、当該モジュールが一部のミラーに
    // 未同期のため使用しない。代わりに TextureView で自前プレビューする。
    def camerax_version = "1.6.2"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"

    // ML Kit 顔検出（オンデバイス・モデル同梱）
    implementation "com.google.mlkit:face-detection:16.1.6"
}
